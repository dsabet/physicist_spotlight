# .codex/config.toml

# Coordinate research and review with Astra at medium effort.
model = "gpt-6-astra"
model_reasoning_effort = "medium"

# Allow the parent agent to edit files in this project.
sandbox_mode = "workspace-write"

# During development, ask before actions that require elevated permission.
approval_policy = "on-request"

# Your task depends heavily on current biographical research.
web_search = "live"

[agents]
enabled = true

# Parent + up to 4 simultaneously active subagents.
# Three researchers in parallel leaves room for another specialist.
max_concurrent_threads_per_session = 4

# Keep unspecified subagents on Terra rather than inheriting Astra.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[sandbox_workspace_write]
# I would initially leave shell-level internet access off.
# Codex's built-in web search can still be used for research.
network_access = false
